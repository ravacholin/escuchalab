<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0e11" />
    <title>EscuchaLAB</title>
    <link rel="icon" type="image/png" href="/escucha-logo.png" />
    <link rel="apple-touch-icon" href="/escucha-logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              // Monochrome system — black / graphite / white, no hue
              ink: '#0c0e11',
              panel: { DEFAULT: '#14171b', 2: '#1a1f24', 3: '#20262d' },
              line: { DEFAULT: '#282e35', soft: '#20252b' },
              fg: '#e9edf0',
              muted: '#98a1a9',
              faint: '#69727a',
              accent: { DEFAULT: '#f4f6f8', deep: '#c4cace' },
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'shimmer': 'shimmer 1.6s linear infinite',
              'eq': 'eq 1.8s ease-in-out infinite',
              'ping-slow': 'ping-slow 1.8s ease-out infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(200%)' },
              },
              eq: {
                '0%,100%': { transform: 'scaleY(.35)' },
                '50%': { transform: 'scaleY(1)' },
              },
              'ping-slow': {
                '0%': { transform: 'scale(1)', opacity: '.5' },
                '100%': { transform: 'scale(1.5)', opacity: '0' },
              },
            }
          }
        }
      }
    </script>
    <style>
      html { color-scheme: dark; }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #0c0e11;
        color: #e9edf0;
        -webkit-font-smoothing: antialiased;
      }

      /* Subtle monochrome scrollbar */
      ::-webkit-scrollbar { width: 11px; height: 11px; background: transparent; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #282e35;
        border: 3px solid #0c0e11;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #3a424a; }
      * { scrollbar-width: thin; scrollbar-color: #282e35 transparent; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Range inputs — monochrome, no default accent color */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 6px;
        background: #20262d;
        cursor: pointer;
      }
      input[type="range"]:disabled { opacity: .4; }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px; height: 13px;
        border-radius: 50%;
        background: #f4f6f8;
        border: 0;
        box-shadow: 0 0 0 1px #0c0e11, 0 1px 4px rgba(0,0,0,.6);
      }
      input[type="range"]::-moz-range-thumb {
        width: 13px; height: 13px;
        border-radius: 50%;
        background: #f4f6f8;
        border: 0;
      }
      input[type="range"]::-moz-range-track { height: 4px; border-radius: 6px; background: #20262d; }

      /* Native select option colors (dropdown menu) */
      select option { background: #14171b; color: #e9edf0; }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^2.13.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body class="bg-ink text-fg min-h-screen selection:bg-accent selection:text-ink">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
